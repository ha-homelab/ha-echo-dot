name: Host regression tests

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: host-tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.4'
          enable-cache: false
      - name: Resolve the complete reference training lock without installation
        run: python training/check_reference_lock.py
      - name: Prefer the provisioned Ubuntu archive fallback
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        run: |
          sudo env RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" RUNNER_OS="$RUNNER_OS" "$(command -v node)" <<'NODE'
          if (process.env.RUNNER_ENVIRONMENT !== 'github-hosted' || process.env.RUNNER_OS !== 'Linux') {
            console.log('Ubuntu mirror preparation does not apply to this runner');
            process.exit(0);
          }
          const fs = require('node:fs');
          const mirrorFile = '/etc/apt/apt-mirrors.txt';
          let stat;
          try {
            stat = fs.lstatSync(mirrorFile);
          } catch (error) {
            if (error.code !== 'ENOENT') throw error;
            console.log('No image-provisioned Ubuntu mirror list; leaving APT unchanged');
            process.exit(0);
          }
          if (!stat.isFile() || stat.isSymbolicLink()) throw new Error('Ubuntu mirror list is not a regular file');
          const original = fs.readFileSync(mirrorFile);
          const text = original.toString('utf8');
          if (!Buffer.from(text).equals(original)) throw new Error('Ubuntu mirror list is not valid UTF-8');
          const lines = text.match(/[^\n]*\n|[^\n]+$/g) || [];
          const entries = lines.map((line, index) => ({index, fields: line.trim().split(/[ \t]+/)}))
            .filter(({fields}) => fields[0] && !fields[0].startsWith('#'));
          const azure = entries.filter(({fields}) => fields[0] === 'http://azure.archive.ubuntu.com/ubuntu/');
          if (!azure.length) {
            console.log('Azure Ubuntu mirror is not configured; leaving APT unchanged');
            process.exit(0);
          }
          const fallback = entries.filter(({fields}) => fields[0] === 'https://archive.ubuntu.com/ubuntu/');
          if (azure.length !== 1 || azure[0].fields.length !== 2 || azure[0].fields[1] !== 'priority:1' ||
              fallback.length !== 1 || fallback[0].fields.length !== 2 || fallback[0].fields[1] !== 'priority:2') {
            console.log('::warning::Unrecognized Ubuntu mirror configuration; leaving APT unchanged');
            process.exit(0);
          }
          const updated = lines.filter((_, index) => index !== azure[0].index).join('');
          if (!fs.readFileSync(mirrorFile).equals(original)) throw new Error('Ubuntu mirror list changed during preparation');
          fs.writeFileSync(mirrorFile, updated);
          console.log('Removed the Azure entry; retained the image-provisioned HTTPS Ubuntu fallback');
          NODE
      - name: Install bounded host-test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-host-tests.txt
          python -m pip install --only-binary=:all: -r requirements-tls-test.txt -r requirements-lint.txt
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Check all Python source diagnostics
        run: git ls-files -z -- '*.py' | xargs -0 python -m ruff check --isolated --select F --ignore-noqa --
      - name: Run synthetic host contracts without training or device access
        run: |
          python scripts/test_package_host_tools.py
          python scripts/test_prepare_public_release.py
          python scripts/prepare_public_release.py --check-only
          python training/test_pipeline.py
          python training/test_delivery.py
          python training/test_warm_start.py
          python training/validation/test_evaluate.py
          python -m unittest discover -s training/data -v
          python -m unittest discover -s training/recorder -v
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: training/validation/go.mod
          cache-dependency-path: training/validation/go.sum
      - name: Test exact-runtime evaluation helpers
        working-directory: training/validation
        run: go test -race ./...
      - name: Build both produced native helpers through the public command
        env:
          GOMAXPROCS: '2'
          GOFLAGS: '-p=2'
        run: |
          python3 training/pipeline.py --work-dir "$RUNNER_TEMP/wake-build" build
          "$RUNNER_TEMP/wake-build/bin/validate" --help
          python3 - <<'PYTHON'
          import math, os, pathlib, struct, subprocess
          binary = pathlib.Path(os.environ['RUNNER_TEMP']) / 'wake-build/bin/gofeatures'
          output = subprocess.check_output([str(binary)], input=bytes(32000), timeout=30)
          assert output and len(output) % 160 == 0, 'Expected complete 40-column frontend frames'
          assert all(math.isfinite(value[0]) for value in struct.iter_unpack('<f', output))
          PYTHON
      - name: Retain native source and binary hash receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wake-validation-build-receipt
          path: ${{ runner.temp }}/wake-build/bin/build.json
          if-no-files-found: error
          retention-days: 30
