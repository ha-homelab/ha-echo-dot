name: Host regression tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install bounded host-test dependencies
        run: |
          python -m pip install --only-binary=:all: numpy==1.26.4
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Run synthetic host contracts without training or device access
        run: |
          python scripts/test_prepare_public_release.py
          python scripts/prepare_public_release.py --check-only
          python training/test_pipeline.py
          python training/test_delivery.py
          python training/test_warm_start.py
          python training/validation/test_evaluate.py
          python -m unittest discover -s training/data -v
          python -m unittest discover -s training/recorder -v
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: training/validation/go.mod
          cache-dependency-path: training/validation/go.sum
      - name: Test exact-runtime evaluation helpers
        working-directory: training/validation
        run: go test -race ./...
