version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily

  - package-ecosystem: docker
    directory: /host/synology
    schedule:
      interval: daily

  - package-ecosystem: pip
    directory: /training
    schedule:
      interval: daily
    # The reference builder is validated with Python 3.11, NumPy 1.26 and TF 2.18.
    # Raise these bounds only with a complete lock + builder/export parity check.
    # Compatible patches remain eligible; security migrations require the same check.
    ignore:
      - dependency-name: tensorflow
        versions: [">=2.19"]
      - dependency-name: tf-keras
        versions: [">=2.19"]
      - dependency-name: numpy
        versions: [">=2"]
      # ml-dtypes 0.6 requires NumPy 2; keep the recorded NumPy 1.x recipe.
      - dependency-name: ml-dtypes
        versions: [">=0.6"]
      # TensorFlow 2.18 requires protobuf <6 and TensorBoard <2.19.
      - dependency-name: protobuf
        versions: [">=6"]
      - dependency-name: tensorboard
        versions: [">=2.19"]
      - dependency-name: scipy
        versions: [">=1.18"]
    groups:
      tensorflow-runtime:
        patterns:
          - tensorflow
          - tensorflow-metal
          - tf-keras
          - tensorboard
          - ml-dtypes
          - protobuf
          - numpy
          - h5py
          - keras

  - package-ecosystem: gomod
    directory: /training/validation
    schedule:
      interval: daily
